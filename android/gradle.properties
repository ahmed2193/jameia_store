org.gradle.jvmargs=-Xmx8G -XX:MaxMetaspaceSize=4G -XX:ReservedCodeCacheSize=512m -XX:+HeapDumpOnOutOfMemoryError
android.useAndroidX=true
# AGP 9 flags, as generated by the Flutter 3.47 template: keep the legacy DSL and
# let the Flutter Gradle plugin apply KGP until Flutter defaults to built-in Kotlin.
android.newDsl=false
android.builtInKotlin=false
# Kotlin incremental compilation breaks on Windows when the project and the pub
# cache sit on different drives (F: vs C:): plugin modules fail with "Could not
# close incremental caches ... is already registered". The Kotlin sources here
# are tiny, so compile them non-incrementally.
kotlin.incremental=false
