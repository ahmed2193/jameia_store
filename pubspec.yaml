name: jameia_mart
description: "JameiaMart — Flutter app on Clean Architecture + Cubit."
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.13.3

# ─────────────────────────────────────────────────────────────────────────────
# Dependencies (mirrors the one_day reference stack)
#   State management : flutter_bloc (Cubit)
#   Dependency inj.  : get_it (single `sl` root in core/config/service_locator.dart)
#   Error boundary   : dartz (Either<Failure, T>) + equatable
#   Networking       : dio behind the ApiConsumer interface (dummy datasources for now)
# ─────────────────────────────────────────────────────────────────────────────
dependencies:
  flutter:
    sdk: flutter

  cupertino_icons: ^1.0.9

  # Index-exact scroll for the shop rank sections (jm3eia products_screen flow):
  # ScrollablePositionedList.scrollTo(index) lands a rank flush under the rail
  # even when far/unbuilt (no estimate/converge needed).
  scrollable_positioned_list: ^0.3.8

  # State management (Cubit)
  flutter_bloc: ^9.1.1
  bloc: ^9.2.1

  # Dependency injection
  get_it: ^9.2.1

  # Functional error handling / value equality
  dartz: ^0.10.1
  equatable: ^3.0.0

  # Networking
  dio: ^5.11.1
  internet_connection_checker_plus: ^3.1.2

  # Local storage
  shared_preferences: ^2.5.5

  # Localization (AR / EN) — easy_localization drives runtime locale + RTL.
  easy_localization: ^3.0.8

  # Locale-aware number/date/currency formatting (Arabic-Indic digits, grouping,
  # KD ↔ د.ك). Promoted from transitive (pulled by easy_localization) to a direct
  # dependency since Formatters/PriceText now use it directly.
  intl: ^0.20.3

  # UI/UX fidelity packages (RTL/guardrail-safe)
  flutter_staggered_grid_view: ^0.7.0
  skeletonizer: ^3.0.0
  smooth_page_indicator: ^3.0.0
  # Vector scan-line glyph in the jameia search bar (ported from jm3eia).
  flutter_svg: ^2.3.0
  cached_network_image: ^4.0.0
  # Image stack internals: shared disk cache manager + per-request timeout
  # service + temp-dir cache-info (promoted from transitive to direct deps).
  flutter_cache_manager: ^3.4.3
  path_provider: ^2.1.6
  http: ^1.6.0
  visibility_detector: ^0.4.0+2
  sliver_tools: ^0.2.12

  # Lottie vector animations (real Jameia splash_lottie_default.json).
  lottie: ^3.5.1

  # Live maps for order tracking / shop + address map surfaces.
  google_maps_flutter: ^2.18.1

  # Real reverse-geocoding (native platform Geocoder) — resolves a pinned
  # LatLng to a localized city / area / street / house, matching the app
  # locale. Falls back to the offline JameiaGeocode when unavailable.
  geocoding: ^5.0.0

  # Device current location for the address map-picker initial centre
  # (Jameia `SLLocation.getLocation` / `address_..._currentlocation`).
  geolocator: ^14.0.3

  # Voice search — on-device speech-to-text + runtime microphone permission
  # (search screen mic → VoiceSearchScreen).
  speech_to_text: ^7.5.0
  permission_handler: ^13.0.2
  go_router: ^18.0.1
  flutter_secure_storage: ^11.2.0

dev_dependencies:
  flutter_test:
    sdk: flutter

  flutter_lints: ^6.0.0
  bloc_test: ^10.0.0

  # App-icon + native-splash generation for the JameiaMart re-skin. Config blocks
  # live at the bottom of this file; source art in assets/launcher + assets/images
  # (produced by tool/splash_icon/apply_new_assets.ps1).
  flutter_launcher_icons: ^0.14.4
  flutter_native_splash: ^2.4.8

flutter:
  uses-material-design: true

  assets:
    - assets/i18n/
    - assets/data/
    - assets/data/jameia/
    - assets/images/
    # JameiaMart launcher/splash source art (read by flutter_launcher_icons +
    # flutter_native_splash: app_icon, app_icon_square, a12_splash).
    - assets/launcher/
    # Vector glyphs (jameia search scan-line, ported from jm3eia).
    - assets/svg/
    # Real Jameia rasters extracted from the decoded APK (Mach UI bundles),
    # grouped by screen. Referenced by name via JameiaAssets (core/design).
    - assets/images/jameia/
    - assets/images/jameia/osg_home/
    - assets/images/jameia/home/
    - assets/images/jameia/shop/
    - assets/images/jameia/order_status/
    - assets/images/jameia/order_confirm/
    - assets/images/jameia/mine/
    - assets/images/jameia/login/
    - assets/images/jameia/review/
    # Marketing (invite friends + punctual) rasters from mkt_invite_main / c_punctual.
    - assets/images/jameia/marketing/
    # Home popup / overlay rasters (coupon pop, image-text, vertical banner,
    # bottom overlay, newborn, popup_list) from the mkt_resources_* bundles.
    - assets/images/jameia/popup/
    # Real Jameia animations (brand loader GIF, onboarding slide, splash Lottie, shine).
    - assets/animations/

  # GLSL fragment shaders ported from Jameia's video-effects SDK (.fsh) to the
  # Flutter runtime-effect spec. Driven by core/motion/shader_transition.dart.
  shaders:
    - shaders/dissolve.frag
    - shaders/affine_reveal.frag
    - shaders/blur.frag

  # Real Jameia fonts extracted from the APK (assets/fonts/).
  # Brand body face = Noto Sans (+ NotoSansArabicUI for RTL); digits = MT Digital Display;
  # display/brand = Jameia OTF; iconfont = JameiaIcon (wm_c_iconfont glyphs).
  fonts:
    - family: NotoSans
      fonts:
        - asset: assets/fonts/NotoSans-Regular.ttf
          weight: 400
        - asset: assets/fonts/NotoSans-Medium.ttf
          weight: 500
        - asset: assets/fonts/NotoSans-SemiBold.ttf
          weight: 600
        - asset: assets/fonts/NotoSans-Bold.ttf
          weight: 700
    - family: NotoSansArabicUI
      fonts:
        - asset: assets/fonts/NotoSansArabicUI-Regular.ttf
          weight: 400
        - asset: assets/fonts/NotoSansArabicUI-Medium.ttf
          weight: 500
        - asset: assets/fonts/NotoSansArabicUI-SemiBold.ttf
          weight: 600
        - asset: assets/fonts/NotoSansArabicUI-Bold.ttf
          weight: 700
    - family: Jameia
      fonts:
        - asset: assets/fonts/Jameia-Regular.otf
          weight: 400
        - asset: assets/fonts/Jameia-Medium.otf
          weight: 500
        - asset: assets/fonts/Jameia-Bold.otf
          weight: 700
    - family: MTDigit
      fonts:
        - asset: assets/fonts/MTDigitalDisplayKT-Regular.ttf
          weight: 400
        - asset: assets/fonts/MTDigitalDisplayKT-Medium.ttf
          weight: 500
        - asset: assets/fonts/MTDigitalDisplayKT-Bold.ttf
          weight: 700
    - family: JameiaIcon
      fonts:
        - asset: assets/fonts/wm_c_iconfont.ttf

# ─────────────────────────────────────────────────────────────────────────────
# JameiaMart app-icon generation (flutter_launcher_icons). Source art built by
# tool/splash_icon/apply_new_assets.ps1. Regenerate with:
#     dart run flutter_launcher_icons
# The adaptive FOREGROUND (app_icon.png) is an opaque green-gradient tile with the
# whole wordmark centered, so adaptive_icon_background is only parallax insurance.
# ─────────────────────────────────────────────────────────────────────────────
flutter_launcher_icons:
  android: true
  ios: true
  image_path: "assets/launcher/app_icon_square.png"
  adaptive_icon_foreground: "assets/launcher/app_icon.png"
  adaptive_icon_background: "#EAF7E6"
  remove_alpha_ios: true
  min_sdk_android: 21

# ─────────────────────────────────────────────────────────────────────────────
# JameiaMart native splash (flutter_native_splash). WHITE background (the art has
# its own white bg + baked tagline). Full-bleed on Android ≤11 / iOS; Android 12+
# shows white + the centered wordmark icon. Regenerate with:
#     dart run flutter_native_splash:create
# ─────────────────────────────────────────────────────────────────────────────
flutter_native_splash:
  color: "#FFFFFF"
  background_image: assets/images/splash_screen.png
  android: true
  ios: true
  web: false
  fullscreen: false
  ios_content_mode: scaleAspectFill

  android_12:
    color: "#FFFFFF"
    image: assets/launcher/a12_splash.png
    icon_background_color: "#FFFFFF"
