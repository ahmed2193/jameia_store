name: keeta_clone
description: "KeeTa clone — Flutter rebuild of Meituan KeeTa (Consumer) on Clean Architecture + Cubit."
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.11.5

# ─────────────────────────────────────────────────────────────────────────────
# Dependencies (mirrors the one_day reference stack)
#   State management : flutter_bloc (Cubit)
#   Dependency inj.  : get_it (single `sl` root in core/config/service_locator.dart)
#   Error boundary   : dartz (Either<Failure, T>) + equatable
#   Networking       : dio behind the ApiConsumer interface (dummy datasources for now)
# ─────────────────────────────────────────────────────────────────────────────
dependencies:
  flutter:
    sdk: flutter

  cupertino_icons: ^1.0.8

  # State management (Cubit)
  flutter_bloc: ^9.1.1
  bloc: ^9.0.0

  # Dependency injection
  get_it: ^8.0.3

  # Functional error handling / value equality
  dartz: ^0.10.1
  equatable: ^2.0.7

  # Networking
  dio: ^5.7.0
  internet_connection_checker_plus: ^2.7.1

  # Local storage
  shared_preferences: ^2.3.3

  # Localization (AR / EN) — easy_localization drives runtime locale + RTL.
  easy_localization: ^3.0.7

  # UI/UX fidelity packages (RTL/guardrail-safe)
  flutter_staggered_grid_view: ^0.7.0
  skeletonizer: ^2.1.3
  smooth_page_indicator: ^1.2.1
  cached_network_image: ^3.4.1
  visibility_detector: ^0.4.0+2
  sliver_tools: ^0.2.12

  # Lottie vector animations (real KeeTa splash_lottie_default.json).
  lottie: ^3.1.3

dev_dependencies:
  flutter_test:
    sdk: flutter

  flutter_lints: ^6.0.0
  bloc_test: ^10.0.0

flutter:
  uses-material-design: true

  assets:
    - assets/i18n/
    - assets/data/
    - assets/images/
    # Real KeeTa rasters extracted from the decoded APK (Mach UI bundles),
    # grouped by screen. Referenced by name via KeetaAssets (core/design).
    - assets/images/keeta/
    - assets/images/keeta/osg_home/
    - assets/images/keeta/home/
    - assets/images/keeta/shop/
    - assets/images/keeta/order_status/
    - assets/images/keeta/order_confirm/
    - assets/images/keeta/mine/
    - assets/images/keeta/login/
    # Real KeeTa animations (brand loader GIF, onboarding slide, splash Lottie).
    - assets/animations/

  # Real KeeTa fonts extracted from the APK (assets/fonts/).
  # Brand body face = Noto Sans (+ NotoSansArabicUI for RTL); digits = MT Digital Display;
  # display/brand = KeeTa OTF; iconfont = KeetaIcon (wm_c_iconfont glyphs).
  fonts:
    - family: NotoSans
      fonts:
        - asset: assets/fonts/NotoSans-Regular.ttf
          weight: 400
        - asset: assets/fonts/NotoSans-Medium.ttf
          weight: 500
        - asset: assets/fonts/NotoSans-SemiBold.ttf
          weight: 600
        - asset: assets/fonts/NotoSans-Bold.ttf
          weight: 700
    - family: NotoSansArabicUI
      fonts:
        - asset: assets/fonts/NotoSansArabicUI-Regular.ttf
          weight: 400
        - asset: assets/fonts/NotoSansArabicUI-Medium.ttf
          weight: 500
        - asset: assets/fonts/NotoSansArabicUI-SemiBold.ttf
          weight: 600
        - asset: assets/fonts/NotoSansArabicUI-Bold.ttf
          weight: 700
    - family: KeeTa
      fonts:
        - asset: assets/fonts/KeeTa-Regular.otf
          weight: 400
        - asset: assets/fonts/KeeTa-Medium.otf
          weight: 500
        - asset: assets/fonts/KeeTa-Bold.otf
          weight: 700
    - family: MTDigit
      fonts:
        - asset: assets/fonts/MTDigitalDisplayKT-Regular.ttf
          weight: 400
        - asset: assets/fonts/MTDigitalDisplayKT-Medium.ttf
          weight: 500
        - asset: assets/fonts/MTDigitalDisplayKT-Bold.ttf
          weight: 700
    - family: KeetaIcon
      fonts:
        - asset: assets/fonts/wm_c_iconfont.ttf
