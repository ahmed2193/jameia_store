name: hero_mart
description: "Hero — Flutter app on Clean Architecture + Cubit."
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.13.3

# ─────────────────────────────────────────────────────────────────────────────
# Dependencies (mirrors the one_day reference stack)
#   State management : flutter_bloc (Cubit)
#   Dependency inj.  : get_it (single `sl` root in core/config/service_locator.dart)
#   Error boundary   : dartz (Either<Failure, T>) + equatable
#   Networking       : dio behind the ApiConsumer interface (dummy datasources for now)
# ─────────────────────────────────────────────────────────────────────────────
dependencies:
  flutter:
    sdk: flutter

  # State management (Cubit)
  flutter_bloc: ^9.1.1

  # Dependency injection
  get_it: ^9.2.1

  # Functional error handling / value equality
  dartz: ^0.10.1
  equatable: ^3.0.0

  # Networking
  dio: ^5.11.1
  internet_connection_checker_plus: ^3.1.2

  # Local storage
  shared_preferences: ^2.5.5

  # Localization (AR / EN) — easy_localization drives runtime locale + RTL.
  easy_localization: ^3.0.8

  # Locale-aware number/date/currency formatting (Arabic-Indic digits, grouping,
  # KD ↔ د.ك). Promoted from transitive (pulled by easy_localization) to a direct
  # dependency since Formatters/PriceText now use it directly.
  intl: ^0.20.3

  # UI/UX fidelity packages (RTL/guardrail-safe)
  skeletonizer: ^3.0.0
  smooth_page_indicator: ^3.0.0
  # Vector scan-line glyph in the Hero search bar (ported from the source app).
  flutter_svg: ^2.3.0
  cached_network_image: ^4.0.0
  # Image stack internals: shared disk cache manager + per-request timeout
  # service + temp-dir cache-info (promoted from transitive to direct deps).
  flutter_cache_manager: ^3.4.3
  path_provider: ^2.1.6
  http: ^1.6.0
  visibility_detector: ^0.4.0+2


  # Live maps for order tracking / shop + address map surfaces.
  google_maps_flutter: ^2.18.1
  # The Android implementation (already resolved through the plugin) named
  # directly for `GoogleMapsFlutterAndroid.warmup()`: the Maps SDK starts
  # before the first map screen instead of stalling it (HeroMapWarmup).
  google_maps_flutter_android: ^2.19.13

  # Real reverse-geocoding (native platform Geocoder) — resolves a pinned
  # LatLng to a localized city / area / street / house, matching the app
  # locale. When it cannot answer, the pin stays a bare point.
  geocoding: ^5.0.0

  # Device current location for the address map-picker initial centre
  # (Hero `SLLocation.getLocation` / `address_..._currentlocation`).
  geolocator: ^14.0.3

  # Voice search — on-device speech-to-text + runtime microphone permission
  # (search screen mic → VoiceSearchScreen).
  speech_to_text: ^7.5.0
  permission_handler: ^13.0.2
  go_router: ^18.0.1
  flutter_secure_storage: ^11.2.0
  flutter_local_notifications: ^22.3.1
  url_launcher: ^6.3.2
  audioplayers: ^6.8.1

  # Order invoice as a PDF (features/orders, invoice page): `pdf` lays the
  # document out in pure Dart (vector text, embedded Noto fonts, Arabic
  # shaping + bidi for the RTL copy); `printing` hands it to the system print
  # dialog and share sheet; `flutter_file_dialog` saves it where the customer
  # picks (Android "Save to…" / iOS "Save to Files") — no storage permission.
  pdf: ^3.13.1
  printing: ^5.15.1
  flutter_file_dialog: ^3.3.3

dev_dependencies:
  flutter_test:
    sdk: flutter

  flutter_lints: ^6.0.0
  bloc_test: ^10.0.0

  # App-icon + native-splash generation. Config blocks live at the bottom of
  # this file; icon art in assets/app_icon, splash mark in assets/splash (both
  # rendered by tool/splash/*_test.dart from the splash painter).
  flutter_launcher_icons: ^0.14.4
  flutter_native_splash: ^2.4.8

flutter:
  uses-material-design: true

  assets:
    - assets/i18n/
    - assets/data/
    - assets/data/hero/
    - assets/images/
    # The in-app logo tile (HeroAssets.appLogo). The app icon art
    # (assets/app_icon/) and the native splash mark (assets/splash/) are
    # generator inputs only and are NOT bundled.
    - assets/launcher/
    # Vector glyphs (offer + checkout glyphs, colour baked in; the official
    # Facebook / Instagram / X marks and Kuwait's flag, never recoloured).
    - assets/svg/
    # Official Google / Apple marks for the sign-in buttons (1x, 2x, 3x).
    - assets/images/brands/
    # The home first-order welcome-gift animation (HeroAssets.popup*).
    - assets/images/hero/popup/
    # Short brand chimes for live order tracking (core/motion/earcons.dart).
    - assets/sounds/
    # Font licences (OFL), shown on the licences page (config/theme/font_licenses.dart).
    - assets/licenses/

  # Fonts (assets/fonts/), all SIL OFL 1.1 or our own; licences in assets/licenses/.
  # Body face = Noto Sans (+ NotoSansArabicUI for RTL); price digits = HeroDigits
  # (Fredoka, the round face of the Hero "h": 0-9 . , : % + - / × only, 400/500/700);
  # icons = HeroIcons (assets/fonts/hero_icons.ttf, built by tool/icons).
  fonts:
    - family: NotoSans
      fonts:
        - asset: assets/fonts/NotoSans-Regular.ttf
          weight: 400
        - asset: assets/fonts/NotoSans-Medium.ttf
          weight: 500
        - asset: assets/fonts/NotoSans-SemiBold.ttf
          weight: 600
        - asset: assets/fonts/NotoSans-Bold.ttf
          weight: 700
    - family: NotoSansArabicUI
      fonts:
        - asset: assets/fonts/NotoSansArabicUI-Regular.ttf
          weight: 400
        - asset: assets/fonts/NotoSansArabicUI-Medium.ttf
          weight: 500
        - asset: assets/fonts/NotoSansArabicUI-SemiBold.ttf
          weight: 600
        - asset: assets/fonts/NotoSansArabicUI-Bold.ttf
          weight: 700
    - family: HeroDigits
      fonts:
        - asset: assets/fonts/HeroDigits-Regular.ttf
          weight: 400
        - asset: assets/fonts/HeroDigits-Medium.ttf
          weight: 500
        - asset: assets/fonts/HeroDigits-Bold.ttf
          weight: 700
    - family: HeroIcons
      fonts:
        - asset: assets/fonts/hero_icons.ttf

# ─────────────────────────────────────────────────────────────────────────────
# Hero app icon (flutter_launcher_icons), the same mark as the splash: the
# white bag in its yellow cape on brand green (AppColors.primary). The art is
# rendered from the mark painter itself (generator inputs, not bundled):
#     flutter test tool/splash/render_app_icons_test.dart
#     dart run flutter_launcher_icons
# Android: adaptive icon = green background + the mark inside the 66/108 dp
# safe zone (inset 0: the art already carries its padding), monochrome layer
# for Android 13+ themed icons. iOS: opaque square + iOS 18 dark / tinted.
# Web: favicon, PWA icons and the manifest's theme colour.
# ─────────────────────────────────────────────────────────────────────────────
flutter_launcher_icons:
  android: true
  ios: true
  image_path: "assets/app_icon/icon_ios.png"
  adaptive_icon_foreground: "assets/app_icon/icon_foreground.png"
  adaptive_icon_background: "#22C55E"
  adaptive_icon_foreground_inset: 0
  adaptive_icon_monochrome: "assets/app_icon/icon_monochrome.png"
  remove_alpha_ios: true
  background_color_ios: "#22C55E"
  image_path_ios_dark_transparent: "assets/app_icon/icon_ios_dark.png"
  image_path_ios_tinted_grayscale: "assets/app_icon/icon_ios_dark.png"
  desaturate_tinted_to_grayscale_ios: true
  min_sdk_android: 21
  web:
    generate: true
    image_path: "assets/app_icon/icon_ios.png"
    background_color: "#22C55E"
    theme_color: "#22C55E"

# ─────────────────────────────────────────────────────────────────────────────
# Hero native splash (flutter_native_splash): brand green (AppColors.primary)
# with the white bag in its yellow cape centred, identical to the first frame
# of the Flutter splash (features/splash), which then flies it into the full
# lockup. The mark is rendered from the splash painter itself:
#     flutter test tool/splash/render_native_splash_test.dart
#     dart run flutter_native_splash:create
# splash_mark.png is 1152² read as 4× → a 288 dp/pt box on every platform
# (Android 12+ icon, Android ≤11 centred bitmap, iOS LaunchImage).
# ─────────────────────────────────────────────────────────────────────────────
flutter_native_splash:
  color: "#22C55E"
  image: assets/splash/splash_mark.png
  android_gravity: center
  ios_content_mode: center
  android: true
  ios: true
  web: false
  fullscreen: false

  android_12:
    color: "#22C55E"
    image: assets/splash/splash_mark.png
